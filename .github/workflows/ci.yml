name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # Bazı test dosyaları pytest.importorskip kullanır: paket eksikse dosya SESSİZCE atlanır ve
      # CI yeşil görünür. Bu yüzden "could not import" nedenli atlamalar hata sayılır.
      # (OCR testi Tesseract yoksa meşru olarak atlanır; buna dokunulmaz.)
      - name: Run tests
        shell: bash
        run: |
          pytest -q -rs -p no:cacheprovider | tee pytest.log
          if grep -q "could not import" pytest.log; then
            echo "::error::Bir test dosyası eksik bağımlılık yüzünden atlandı; requirements-ci.txt'e ekle."
            exit 1
          fi
